spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:prod-db}:${DB_PORT:3306}/${DB_NAME:medibridge_sos_prod}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:produser}
    password: ${DB_PASSWORD:***CONFIGURE_ME***}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  # Redis Configuration
  data:
    redis:
      url: ${REDIS_URL:redis://prod-redis:6379}

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-prod:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: ${spring.application.name}-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "*"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  mail:
    host: ${SMTP_HOST:mail-prod.internal}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USER:***CONFIGURE_ME***}
    password: ${SMTP_PASSWORD:***CONFIGURE_ME***}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
            required: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Application-specific mail configuration
app:
  mail:
    from: ${MAIL_FROM:noreply@medibridge.com}

jwt:
  secret: ${JWT_SECRET:***CONFIGURE_ME***}
  expiration: ${JWT_EXPIRATION_MS:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}

websocket:
  allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:https://medibridge-prod.vercel.app}

logging:
  level:
    root: ${LOG_LEVEL:WARN}
    com.medibridge: ${LOG_LEVEL_MEDIBRIDGE:INFO}
  file:
    name: ${LOG_FILE_PATH:/var/log/medibridge/sos-ambulance-service.log}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_PROTOCOL:https}://${EUREKA_HOST:eureka-prod}:${EUREKA_PORT:443}/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90