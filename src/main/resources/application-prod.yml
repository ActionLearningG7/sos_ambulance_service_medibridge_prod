spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://prod-db-server:3306/medibridge_sos_prod?useSSL=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

websocket:
  allowed-origins: ${WEBSOCKET_ORIGINS}

logging:
  level:
    root: WARN
    com.medibridge: INFO
  file:
    name: /var/log/medibridge/sos-ambulance-service.log
